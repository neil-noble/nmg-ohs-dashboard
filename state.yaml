decisions:
  data_source: live PeopleTray only; screenshot spreadsheet is layout template (its Sept column was mostly Aug data)
  reporting_month: last completed month (AWST), FYTD from 1 Jul, rebuild daily
  mining: [CPO - *, Contractors - Local, Contractors - Other]
  exploration: [GG - *, Drilling Contractors]
  excluded: [Flight/Accommodation ONLY, PER - *]
  head_count: employer == New Murchison Gold Ltd, not Contractor type, Perth excluded, as at month end
  panels: [kpi_tiles, event_table, trifr_ltifr_trend, event_trend_by_type, injury_analysis, open_events_actions]
  open_incidents: (2026-10-19) open Mining/Exploration events, most overdue vs targetCloseDate first, top 15 (config.OPEN_INCIDENTS_SHOWN); completion = currentStep; no free-text description (names people, BAC breaches)
  contractor: (2026-10-19) people-feed employer - actions by assigneeId then name; incidents by the reportedTo person's employer (Neil chose); events.company is always null
  es_nonconformances: (2026-10-19, REMOVED 2026-10-22) table of ERT dials below min - superseded by ert_embed; ertdials.py deleted
  ozland_ert: (2026-10-19) Neil - Ozland must provide 2 qualified ERT on day + 2 on night; qualified = Competent in all 6 ERT dial competencies. Daily bar FYTD green/red + % compliant. Sources: powerbi/personrosterssinglesite (history only from 2026-07-19), shifttypes isDayshift/isNightshift, paged personworkrolecompetencycompliance (issue/expiry dates honoured when present). ERT membership = today's workRoles. First run: 0/93 days - only Menghi + Cortale hold all 6 (Menghi from 6 Oct)
  layout: (2026-10-21) Neil - KPI summary on top, then 2 sections. Health & Safety = Leading (corrective actions cards, SHEQ actions, open workflows, outstanding actions list) + Lagging (TRIFR/LTIFR trends, event table, injury classes, events by type/month, event status, injury analysis, open incidents). Emergency Response = ert_embed (since 2026-10-22). test_visuals_sit_under_their_section pins it
  ert_embed: (2026-10-22) Neil - 'remove what you have there and replace it with all of the data from NMG ERT dashboard'. Emergency Response = one full-width card holding an iframe of config.ERT_SITE_URL (live, not a build snapshot); a small same-origin script (both on neil-noble.github.io) sizes it to content (~4750px desktop, ~8000px phone). Brings the ERT page's names + mobiles onto this page (already public there)
  ozland_page: (2026-10-22) Ozland chart left index.html but is still built as docs/ozland.html and published beside it, because the ERT dashboard's ozland.py reads it (OHS_URL -> .../ozland.html). test_ozland_page_keeps_what_the_ert_dashboard_reads pins the parsed markup. Circular by design: OHS shows the ERT page, whose Ozland section comes from OHS ozland.html
  leading_reporting: (2026-10-21) Neil - near miss + hazard reporting in Leading. Near miss = events row 'Near Miss'; hazard = checklistslite 'Hazard Report Form' (not Discarded), bucketed by checklist workgroup, dated checklistDateTime. 12-month line + Mining/Exploration month/FYTD table; Corrective actions card stacked under the table | (2026-10-22) Neil: trend split into two charts, Mining and Exploration (reporting-trend-mining / -exploration), stacked in a span-7 column; unbucketed reports no longer charted
  rate_trend: (2026-10-21) Neil - TRIFR and LTIFR on one 12-month chart; colour = area, LTIFR dashed
  privacy: public Pages site -> counts and rates only, EXCEPT the Outstanding corrective actions list, which shows each open action text and actionee name (Neil asked 2026-10-11)
next: Neil sets PT_WEB_USERNAME + PT_WEB_PASSWORD secrets -> run workflow -> confirm page note says "As shown on PeopleTray"; revoke unused PAGES_TOKEN PAT
publish: workflow dashboard.yml (05:30 + 12:00 AWST, manual dispatch) pushes via SSH deploy key - secret SITE_DEPLOY_KEY, deploy key "nmg-ohs-dashboard workflow" on the site repo. PAGES_TOKEN secret is unused (PAT lacked write, and was pasted in chat) - delete/revoke.
wix: no REST API creates an Editor page with an iframe - manual editor step
