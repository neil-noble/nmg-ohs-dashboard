spec: docs/superpowers/specs/2026-10-11-nmg-ohs-dashboard-design.md
plan: docs/superpowers/plans/2026-10-11-nmg-ohs-dashboard.md
pattern: same as NMG Fuel / NMG ERT (Actions -> static html -> Pages site repo -> Wix iframe)
repos: {source: neil-noble/nmg-ohs-dashboard (private, branch master), site: neil-noble/nmg-ohs-site (public, branch main, Pages)}
pages_url: https://neil-noble.github.io/nmg-ohs-site/
decisions:
  data_source: live PeopleTray only; screenshot spreadsheet is layout template (its Sept column was mostly Aug data)
  reporting_month: last completed month (AWST), FYTD from 1 Jul, rebuild daily
  mining: [CPO - *, Contractors - Local, Contractors - Other]
  exploration: [GG - *, Drilling Contractors]
  excluded: [Flight/Accommodation ONLY, PER - *]
  head_count: employer == New Murchison Gold Ltd, not Contractor type, Perth excluded, as at month end
  panels: [kpi_tiles, event_table, trifr_ltifr_trend, event_trend_by_type, injury_analysis, open_events_actions]
  open_incidents: (2026-10-19) open Mining/Exploration events, most overdue vs targetCloseDate first, top 15 (config.OPEN_INCIDENTS_SHOWN); completion = currentStep; no free-text description (names people, BAC breaches)
  contractor: (2026-10-19) people-feed employer - actions by assigneeId then name; incidents by the reportedTo person's employer (Neil chose); events.company is always null
  es_nonconformances: (2026-10-19, REMOVED 2026-10-22) table of ERT dials below min - superseded by ert_embed; ertdials.py deleted
  ozland_ert: (2026-10-19) Neil - Ozland must provide 2 qualified ERT on day + 2 on night; qualified = Competent in all 6 ERT dial competencies. Daily bar FYTD green/red + % compliant. Sources: powerbi/personrosterssinglesite (history only from 2026-07-19), shifttypes isDayshift/isNightshift, paged personworkrolecompetencycompliance (issue/expiry dates honoured when present). ERT membership = today's workRoles. First run: 0/93 days - only Menghi + Cortale hold all 6 (Menghi from 6 Oct)
  layout: (2026-10-21) Neil - KPI summary on top, then 2 sections. Health & Safety = Leading (corrective actions cards, SHEQ actions, open workflows, outstanding actions list) + Lagging (TRIFR/LTIFR trends, event table, injury classes, events by type/month, event status, injury analysis, open incidents). Emergency Response = ert_embed (since 2026-10-22). test_visuals_sit_under_their_section pins it
  ert_embed: (2026-10-22) Neil - 'remove what you have there and replace it with all of the data from NMG ERT dashboard'. Emergency Response = one full-width card holding an iframe of config.ERT_SITE_URL (live, not a build snapshot); a small same-origin script (both on neil-noble.github.io) sizes it to content (~4750px desktop, ~8000px phone). Brings the ERT page's names + mobiles onto this page (already public there)
  ozland_page: (2026-10-22) Ozland chart left index.html but is still built as docs/ozland.html and published beside it, because the ERT dashboard's ozland.py reads it (OHS_URL -> .../ozland.html). test_ozland_page_keeps_what_the_ert_dashboard_reads pins the parsed markup. Circular by design: OHS shows the ERT page, whose Ozland section comes from OHS ozland.html
  leading_reporting: (2026-10-21) Neil - near miss + hazard reporting in Leading. Near miss = events row 'Near Miss'; hazard = checklistslite 'Hazard Report Form' (not Discarded), bucketed by checklist workgroup, dated checklistDateTime. 12-month line + Mining/Exploration month/FYTD table; Corrective actions card stacked under the table | (2026-10-22) Neil: trend split into two charts, Mining and Exploration (reporting-trend-mining / -exploration), stacked in a span-7 column; unbucketed reports no longer charted | (2026-10-22) Neil: Reports by area table = every FY month (Jul..reporting month) + FYTD, per area (report.reporting.columns; _matrix takes columns). Scrolls sideways late in the FY (26 cols by June)
  rate_trend: (2026-10-21 one combined chart; REPLACED 2026-10-22) Neil - three charts in a row: Mining, Exploration, Combined (rate-trend-mining/-exploration/-combined), TRIFR solid + LTIFR dashed, colour = area (Combined = river). Combined = both areas' injuries / both areas' hours, rolling 12 (frequency_rates(bucket=config.COMBINED))
  events_table: (2026-10-22) Neil - Events table = every FY month + FYTD per area (metrics.fy_columns, report.table_columns). Monthly rate cells NA (FYTD = rolling 12); head count at each month end
  event_trend: (2026-10-22) Neil - Events by month = grouped bars, one per TREND_GROUP per month (tooltips), scrolls sideways on phones
  open_workflows_excluded: (2026-10-22) Neil - Prestart - Light Vehicles off the Open workflows pie; config.WORKFLOWS_NOT_CHARTED holds both names (API 'Prestart - Light Vehicles', web chart 'Light Vehicle Prestarts') plus Exploration Daily Prestart and 2 HR forms
  reporting_to_date: (2026-10-22) Neil - near miss/hazard reporting (charts, area table, by-company table) runs to TODAY incl. the current part month; the rest of the page still stops at the last completed month
  reports_by_company: (2026-10-22) Neil - Reports by area card gains a By company table under the area table (Mining + Exploration together, each FY month + FYTD). Company = REPORTER's employer: near miss -> reportedBy name, hazard report -> checklist userId via people feed; missing reporter -> 'Not in PeopleTray'. NMG + Ozland always listed (Ozland had 0 FYTD at launch)
  close_out: (2026-10-22) Neil - pies under Open incidents, NMG and Ozland Drill and Blast: incidents reported in the last 365 days, Closed by the due date vs Overdue (closed after target only - Neil 2026-10-22; open-past-due listed under the pie, not charted). Company = employer of reportedTo (same as Contractor column). API has NO close date: webcharts.py reads it from the web app's Safety Events search feed /Workflows/Search/GetEventWorkflows?ClosedWorkflowsOnly=true - TransitionDate = day it entered Save and Close; EventCloseDate is the TARGET (matched API target 132/132). Web sign-in fails -> pies replaced by a note
  open_incident_actionee: (2026-10-22) Neil - Open incidents lists the actionee by name. Events feed has no assignee (owner blank, investigator ~never set), so actionee = holder of currentStep: 'Initiator to add information' -> reportedBy, any other step -> reportedTo
  privacy: public Pages site -> counts and rates only, EXCEPT the Outstanding corrective actions list, which shows each open action text and actionee name (Neil asked 2026-10-11); since 2026-10-22 also the Open incidents actionee name
