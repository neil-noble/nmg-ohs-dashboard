decisions:
  data_source: live PeopleTray only; screenshot spreadsheet is layout template (its Sept column was mostly Aug data)
  reporting_month: last completed month (AWST), FYTD from 1 Jul, rebuild daily
  mining: [CPO - *, Contractors - Local, Contractors - Other]
  exploration: [GG - *, Drilling Contractors]
  excluded: [Flight/Accommodation ONLY, PER - *]
  head_count: employer == New Murchison Gold Ltd, not Contractor type, Perth excluded, as at month end
  panels: [kpi_tiles, event_table, trifr_ltifr_trend, event_trend_by_type, injury_analysis, open_events_actions]
  open_incidents: (2026-10-19) open Mining/Exploration events, most overdue vs targetCloseDate first, top 15 (config.OPEN_INCIDENTS_SHOWN); completion = currentStep; no free-text description (names people, BAC breaches)
  contractor: (2026-10-19) people-feed employer - actions by assigneeId then name; incidents by the reportedTo person's employer (Neil chose); events.company is always null
  es_nonconformances: (2026-10-19) Neil - 'use the data from NMG CPO ERT dashboard', item = coverage below minimum. ertdials.py reads the 3 dial rows (day/night/total) off the public ERT Pages site; lists dials under min as 'Short by N'; unread -> page note + ::warning::, build carries on
  ozland_ert: (2026-10-19) Neil - Ozland must provide 2 qualified ERT on day + 2 on night; qualified = Competent in all 6 ERT dial competencies. Daily bar FYTD green/red + % compliant. Sources: powerbi/personrosterssinglesite (history only from 2026-07-19), shifttypes isDayshift/isNightshift, paged personworkrolecompetencycompliance (issue/expiry dates honoured when present). ERT membership = today's workRoles. First run: 0/93 days - only Menghi + Cortale hold all 6 (Menghi from 6 Oct)
  privacy: public Pages site -> counts and rates only, EXCEPT the Outstanding corrective actions list, which shows each open action text and actionee name (Neil asked 2026-10-11)
