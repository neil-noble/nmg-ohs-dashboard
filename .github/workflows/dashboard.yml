name: NMG OHS Dashboard

on:
  schedule:
    # AWST = UTC+8. GitHub delivers schedule events late, so there are two
    # slots: either one alone keeps the page fresh for the day.
    - cron: '30 21 * * *'   # 05:30 AWST
    - cron: '0 4 * * *'     # 12:00 AWST
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, so two schedule slots landing together cannot race on the push.
concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

      - name: Generate dashboard HTML
        run: python generate_dashboard.py
        env:
          PT_API_KEY: ${{ secrets.PT_API_KEY }}

      - name: Push to public site repo
        # The token reaches the shell as an environment variable, never as script
        # text, so whatever the secret holds cannot be run as a command.
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          git clone "https://x-access-token:${PAGES_TOKEN}@github.com/neil-noble/nmg-ohs-site.git" /tmp/nmg-ohs-site
          cp docs/index.html /tmp/nmg-ohs-site/index.html
          cd /tmp/nmg-ohs-site
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (
            git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')" &&
            git push
          )
