name: NMG OHS Dashboard

on:
  schedule:
    # The real schedule is on cron-job.org, which starts this workflow with a token that can do
    # nothing else (Neil, 2026-10-26): job 8705425 every 5 minutes 05:00-16:55 AWST, and a second
    # job hourly 17:00-04:00. GitHub's own schedule ran a */5 cron only 3 times in 14 hours, so
    # it is kept just as a 3-hourly backup.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One build at a time, so two schedule slots landing together cannot race on the push.
concurrency:
  group: dashboard
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact commits, so a moved tag cannot change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1   # v6
        with:
          python-version: '3.12'

      - name: Run tests
        run: |
          python -m pip install --quiet pytest pyyaml==6.0.2
          python -m pytest -q

      # The rates match the EOM report (Neil, 2026-11-07): the months it has sent use the hours
      # and injuries in the private nmg-eom repo's data/history.yaml, read with a read-only
      # deploy key. If it cannot be read the build carries on with PeopleTray's own figures.
      - name: Fetch the EOM report's history
        continue-on-error: true
        env:
          EOM_DEPLOY_KEY: ${{ secrets.EOM_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh .eom
          echo "$EOM_DEPLOY_KEY" > ~/.ssh/eom_key
          chmod 600 ~/.ssh/eom_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/eom_key -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 --filter=blob:none --sparse git@github.com:neil-noble/nmg-eom.git /tmp/nmg-eom
          git -C /tmp/nmg-eom sparse-checkout set --no-cone /data/history.yaml
          cp /tmp/nmg-eom/data/history.yaml .eom/history.yaml
          rm -f ~/.ssh/eom_key

      # The SHEQ Actions and Open Workflows charts, and the incidents' close dates, are read off
      # PeopleTray's web app, which needs a browser sign-in. That happens at most every 30
      # minutes; in between, the last sign-in's figures come from the cache. If the sign-in
      # fails the build carries on with the API versions and says so on the page.
      - name: Restore the web figures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .webcache
          key: web-${{ github.run_id }}
          restore-keys: web-

      - name: Are the web figures fresh?
        id: web
        run: echo "fresh=$(python generate_dashboard.py --web-cache-fresh)" >> "$GITHUB_OUTPUT"
        env:
          WEB_CACHE: .webcache/web.json

      - name: Install the browser
        if: steps.web.outputs.fresh != 'true'
        run: |
          python -m pip install --quiet playwright==1.62.0 openpyxl==3.1.5
          python -m playwright install --with-deps --only-shell chromium

      - name: Generate dashboard HTML
        run: python generate_dashboard.py
        env:
          WEB_CACHE: .webcache/web.json
          EOM_HISTORY: .eom/history.yaml
          PT_API_KEY: ${{ secrets.PT_API_KEY }}
          PT_WEB_USERNAME: ${{ secrets.PT_WEB_USERNAME }}
          PT_WEB_PASSWORD: ${{ secrets.PT_WEB_PASSWORD }}

      - name: Save the web figures
        if: steps.web.outputs.fresh != 'true' && hashFiles('.webcache/web.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: .webcache
          key: web-${{ github.run_id }}

      - name: Push to public site repo
        # A write deploy key on nmg-ohs-site only. It reaches the shell as an
        # environment variable, never as script text.
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SITE_DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes"
          git clone git@github.com:neil-noble/nmg-ohs-site.git /tmp/nmg-ohs-site
          # Nothing to publish if only the "Data as at" time moved (Neil, 2026-10-26): most
          # 5-minute builds change nothing else, and each push costs the site a Pages run.
          same() { cmp -s <(sed 's|Data as at</span><b>[^<]*|Data as at</span><b>|' "$1") \
                          <(sed 's|Data as at</span><b>[^<]*|Data as at</span><b>|' "$2"); }
          if same docs/index.html /tmp/nmg-ohs-site/index.html \
             && same docs/ozland.html /tmp/nmg-ohs-site/ozland.html; then
            echo "Dashboard unchanged since the last publish - not pushing."
            exit 0
          fi
          cp docs/index.html /tmp/nmg-ohs-site/index.html
          # The ERT dashboard reads its Ozland chart from this page.
          cp docs/ozland.html /tmp/nmg-ohs-site/ozland.html
          cd /tmp/nmg-ohs-site
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # One commit, replaced each time: at 288 builds a day the site repo would otherwise grow
          # without end. Its own workflow publishes each push to Pages.
          git checkout --quiet --orphan publish
          git add -A
          git commit --quiet -m "Dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --quiet --force origin publish:main
